name: Refresh profile cards

on:
  schedule:
    - cron: "17 3 * * *"        # daily
  workflow_dispatch:
  push:
    paths: ["profile.json", "theme.json", "scripts/**", "fonts/**", "assets/**"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools pillow

      - name: Refresh contribution data
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python scripts/fetch_contributions.py

      # --- the two steps to paste into an existing workflow ---
      - name: Render cards
        run: python scripts/build_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards README.md
          git diff --cached --quiet || (git commit -m "chore: refresh profile cards" && git push)
